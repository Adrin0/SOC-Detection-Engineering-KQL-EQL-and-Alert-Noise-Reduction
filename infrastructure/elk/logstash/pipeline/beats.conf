# Every Beat goes through one output, so no Beat can be dropped by a missing branch.
# Index name matches the Beats index templates and data streams (<beat>-<version>);
# load them once per Beat with `<beat> setup --index-management` before shipping.
# Beats Input is plaintext on the LAN (lab trade-off; TLS is an open item).
input {
  beats {
    port => 5044
  }
}

output {
  if [@metadata][beat] == "winlogbeat" {
    # Winlogbeat 8+/9: Sysmon, Security and PowerShell parsing (ECS fields) runs in the
    # routing ingest pipeline, which Winlogbeat does not pass through Logstash by itself.
    elasticsearch {
      hosts => ["https://es01:9200"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "logstash_writer"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      manage_template => false
      data_stream => false
      index => "%{[@metadata][beat]}-%{[@metadata][version]}"
      action => "create"
      pipeline => "winlogbeat-%{[@metadata][version]}-routing"
    }
  } else if [@metadata][pipeline] {
    # Filebeat modules: run the module's ingest pipeline in Elasticsearch
    elasticsearch {
      hosts => ["https://es01:9200"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "logstash_writer"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      manage_template => false
      data_stream => false
      index => "%{[@metadata][beat]}-%{[@metadata][version]}"
      action => "create"
      pipeline => "%{[@metadata][pipeline]}"
    }
  } else {
    elasticsearch {
      hosts => ["https://es01:9200"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "logstash_writer"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      manage_template => false
      data_stream => false
      index => "%{[@metadata][beat]}-%{[@metadata][version]}"
      action => "create"
    }
  }
}
