server.host: "0.0.0.0"
server.name: kibana
server.shutdownTimeout: "5s"
server.publicBaseUrl: "${KIBANA_PUBLIC_URL}"
server.ssl.enabled: true
server.ssl.certificate: config/certs/kibana/kibana.crt
server.ssl.key: config/certs/kibana/kibana.key

elasticsearch.hosts: ["https://es01:9200"]
elasticsearch.username: kibana_system
elasticsearch.password: "${KIBANA_PASSWORD}"
elasticsearch.ssl.certificateAuthorities: [config/certs/ca/ca.crt]

xpack.security.encryptionKey: "${KIBANA_SECURITY_KEY}"
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ESO_KEY}"
xpack.reporting.encryptionKey: "${KIBANA_REPORTING_KEY}"
monitoring.ui.container.elasticsearch.enabled: true
telemetry.optIn: false
telemetry.allowChangingOptInStatus: false

# Fleet preconfiguration: Fleet Server host, default ES output, and the Fleet Server policy
xpack.fleet.agents.fleet_server.hosts: ["${FLEET_URL}"]
xpack.fleet.outputs:
  - id: es-default
    name: default
    type: elasticsearch
    is_default: true
    is_default_monitoring: true
    hosts: ["${ES_PUBLIC_URL}"]
    ca_trusted_fingerprint: "${CA_FINGERPRINT}"
xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    namespace: default
    is_default_fleet_server: true
    monitoring_enabled: [logs, metrics]
    package_policies:
      - name: fleet_server-1
        id: fleet_server-1
        package:
          name: fleet_server
